services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foliopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foliopilot}
      POSTGRES_DB: ${POSTGRES_DB:-foliopilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foliopilot} -d ${POSTGRES_DB:-foliopilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foliopilot}:${POSTGRES_PASSWORD:-foliopilot}@db:5432/${POSTGRES_DB:-foliopilot}
      REDIS_URL: redis://redis:6379/0
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foliopilot}:${POSTGRES_PASSWORD:-foliopilot}@db:5432/${POSTGRES_DB:-foliopilot}_test
      TEST_REDIS_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv
      - ./apps/web:/web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foliopilot}:${POSTGRES_PASSWORD:-foliopilot}@db:5432/${POSTGRES_DB:-foliopilot}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - /app/.venv
      - ./apps/web:/web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-foliopilot}:${POSTGRES_PASSWORD:-foliopilot}@db:5432/${POSTGRES_DB:-foliopilot}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - /app/.venv
      - ./apps/web:/web
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:

